[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
target-version = "py312"
line-length = 120
include = ["api/**.py", "engine/v4/**.py", "tests/**.py"]
extend-exclude = ["scratch", ".venv", "Lib"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E701", "E722"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
files = ["api/", "engine/v4/"]
exclude = ["scratch", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
